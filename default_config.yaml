# BoxR configuration
# Located at ~/.boxraudio.yaml

defaults:
  cache_file: ~/.boxraudio_cache.db
  workers: 4
  size_only: true
  show_banner: true

  # ── Sanitization ────────────────────────────────────────────────────────────
  # Whether to auto-sanitize tags when files move from source to backup.
  sanitize_on_move: false

  # By default BoxR keeps these tags during sanitization:
  #   artist, albumartist, album, title, tracknumber, totaltracks,
  #   discnumber, totaldiscs, date, year, genre, composer,
  #   replaygain_* (all variants), performer, conductor
  # Plus: embedded album art and lyrics are kept by default.
  # Plus: chapter info (CHAP/CTOC) is always kept.
  # Always removed: custom user-defined fields, MusicBrainz IDs,
  #   encoder noise, iTunes-specific tags, comments.
  #
  # Add additional tags to preserve here:
  # keep_tags:
  #   - my_custom_keep_tag
  #
  # To strip album art / lyrics globally, set these to true:
  # strip_art: false
  # strip_lyrics: false

profiles:
  ipod:
    source: ~/Desktop/MusicTFR
    backup: /Volumes/Media Backup/Audio/FLAC
    destination: /Volumes/IPOD/Audio/FLAC
    sync_source: /Volumes/Media Backup/Audio/FLAC
    sync_destination: /Volumes/IPOD/Audio/FLAC
    dedupe_format: mp3
    dedupe_search:
      - /Volumes/Media Backup/Audio/MP3
      - /Volumes/IPOD/Audio/MP3
    clean_empty_dirs: true
    mirror: true
    size_only: true
    sanitize_on_move: true   # auto-clean tags as files are moved
